# This file is based on examples in
# https://docs.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions

# Note that all the "sudo" commands here appear to cause a warning message
# "sudo: setrlimit(RLIMIT_CORE): operation not permitted"
# This appears to be a known harmless annoyance:
# https://gitlab.alpinelinux.org/alpine/aports/-/issues/11122

name: Test

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"] # To sync with coveragerc use 3 level

    steps:
    # First print out lots of information. We do this in separate
    # "name" blocks because otherwise the output gets mixed together
    # in the github actions log.

    - name: Print user and group id
      run: set -ex && id

    - name: PWD
      run: set -ex && pwd

    - name: ls -l
      run: set -ex && ls -l

    - name: apt-get stuff needed for compiling
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential liblapack-dev git m4 libfftw3-dev libopenblas-dev

    - uses: actions/checkout@v7
      with:
          submodules: recursive
          fetch-depth: 0 # setuptools_scm needs the tags

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: which python after python setup
      run: |
        which python
        python --version

    - name: Ensure pip is installed
      run: |
        python -m ensurepip --upgrade
        python -m pip install --upgrade pip

    - name: Verify pip
      run: python -m pip --version

    - name: Install python dependencies
      run: |
        python -m pip install wheel numpy cmake ninja scipy

    - name: Install virtual-casing package
      run: python -m pip install -v .

    - name: Run tests
      run: |
        cd test
        python -m unittest -v test.py

  # The Makefile builds the C API and the standalone binaries, which nothing
  # else in CI covers; a link-order bug went unnoticed here for some time.
  makefile:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
          submodules: recursive
          fetch-depth: 0 # setuptools_scm needs the tags

    - name: apt-get stuff needed for compiling
      run: |
        sudo apt-get update
        # liblapack-dev pulls a libblas.so provider, so -lblas/-llapack resolve
        sudo apt-get install -y build-essential libfftw3-dev liblapack-dev libopenblas-dev

    - name: make all
      run: make all -j$(nproc)

    - name: Run the C API test
      run: ./bin/virtual-casing-c


  # A stale .pyi is worse than none: type checkers report errors that are not
  # real. Regenerate and fail if it differs from what is committed.
  stubs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
          submodules: recursive
          fetch-depth: 0 # setuptools_scm needs the tags

    - name: apt-get stuff needed for compiling
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libfftw3-dev liblapack-dev libopenblas-dev

    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install package and stubgen
      run: python -m pip install . "pybind11-stubgen>=2.5" mypy

    - name: Regenerate stubs and compare
      run: |
        # force the variant being introspected: importing two of them into one
        # process fails, since they register the same pybind11 types
        VIRTUAL_CASING_ISA=baseline pybind11-stubgen virtual_casing._vc_baseline -o regenerated
        # stubgen leaves trailing whitespace in docstrings; the committed copy has
        # it stripped, so normalise before comparing
        sed -i 's/[[:space:]]*$//' regenerated/virtual_casing/_vc_baseline.pyi
        diff -u src/_vc_baseline.pyi regenerated/virtual_casing/_vc_baseline.pyi \
          || { echo "::error::src/_vc_baseline.pyi is stale; regenerate it, strip trailing whitespace, and commit"; exit 1; }

    - name: Type-check the stubs themselves
      run: python -m mypy --strict src/__init__.pyi src/_vc_baseline.pyi
